[project]
name = "monte-carlo-option-engine"
version = "0.9.0"
description = "Monte Carlo option pricing engine"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "scipy>=1.17.0",
    "yfinance>=1.1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]

[project.scripts]
mcoe = "monte_carlo_option_engine.cli:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: tests that hit the internet",
    "slow: long-running statistical tests",
]
